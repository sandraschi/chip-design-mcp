[project]
name = "chip-design-mcp"
version = "0.1.0"
description = "Chip Design MCP server — open-source ASIC/VLSI design automation via MCP tools and REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.23",
    "prefab-ui>=0.18.0",
    "playwright>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "pre-commit>=4.0",
    "ty>=0.0.1a25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chip_design_mcp"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "UP", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["E501"]
"tests/**/*.py" = ["E501", "S101"]
"src/chip_design_mcp/server.py" = ["S603", "S110", "S607", "S104", "S112", "RUF005"]
"src/chip_design_mcp/tools/simulation.py" = ["RUF005"]
