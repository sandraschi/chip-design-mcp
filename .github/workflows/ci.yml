# Ruff + pytest required; ty (Astral) informational until the project is ty-clean.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (dev)
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Pytest
        run: uv run pytest

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Webapp install (frozen)
        run: bun install --frozen-lockfile
        working-directory: webapp

      - name: Biome lint (webapp)
        run: bun run lint
        working-directory: webapp

      - name: Webapp TypeScript check
        run: bunx tsc --noEmit
        working-directory: webapp

      - name: ty typecheck
        run: uv run ty check src
